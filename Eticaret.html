<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Eticaret.css">
    <script src="script.js" defer></script>
    <title>Benim Mağazam</title>
</head>
<body>

    <header class="ust-alan" id="ust-alan-yer"></header>

    <div class="tanitim-alani">
        <h1 class="tanitim-baslik">Yeni Sezon Ürünleri</h1>
        <p class="tanitim-metin">En trend ürünleri keşfetmek için aşağı kaydırın.</p>
        <a href="#urunler" class="tanitim-dugmesi">Alışverişe Başla <i class="fa-solid fa-arrow-down"></i></a>
    </div>

    <div class="ozellikler">
        <div class="ozellik-kutusu">
            <i class="fa-solid fa-truck-fast ozellik-ikon"></i>
            <div><b class="ozellik-baslik">Ücretsiz Kargo</b><span class="ozellik-aciklama">500 ₺ üzeri siparişlerde</span></div>
        </div>
        <div class="ozellik-kutusu">
            <i class="fa-solid fa-shield-halved ozellik-ikon"></i>
            <div><b class="ozellik-baslik">Güvenli Ödeme</b><span class="ozellik-aciklama">256 bit SSL koruma</span></div>
        </div>
        <div class="ozellik-kutusu">
            <i class="fa-solid fa-rotate-left ozellik-ikon"></i>
            <div><b class="ozellik-baslik">Kolay İade</b><span class="ozellik-aciklama">14 gün içinde iade</span></div>
        </div>
    </div>

    <div class="icerik-alani" id="urunler">
        <h2 class="bolum-basligi" id="liste-baslik">Popüler Ürünler</h2>

        <div class="filtre-alani">
            <div class="kategori-cubugu" id="kategori-cubugu"></div>
            <select id="siralama" class="siralama-sec" onchange="urunleriGoster()">
                <option value="">Sıralama: Varsayılan</option>
                <option value="artan">Fiyat: Düşükten yükseğe</option>
                <option value="azalan">Fiyat: Yüksekten düşüğe</option>
            </select>
        </div>

        <div class="urun-izgarasi" id="urun-izgarasi"></div>
        <div class="bos-mesaj" id="bos-sonuc"><i class="fa-solid fa-magnifying-glass"></i><p>Aradığın ürün bulunamadı.</p></div>
    </div>

    <footer class="alt-bilgi" id="alt-bilgi-yer"></footer>

</body>
</html>
