<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Eticaret.css">
    <script src="script.js" defer></script>
    <title>Giriş Yap</title>
</head>
<body class="form-sayfasi">

    <div class="form-kutusu">
        <h2 class="form-baslik">Giriş Yap</h2>

        <form onsubmit="return girisYap()">
            <label class="form-etiket">E-posta</label>
            <input type="email" id="eposta" class="form-girdi" placeholder="ornek@mail.com">

            <label class="form-etiket">Şifre</label>
            <input type="password" id="sifre" class="form-girdi" placeholder="Şifreniz">

            <p class="form-hata" id="hata"></p>
            <button class="ana-dugme form-dugme">Giriş Yap</button>
        </form>

        <p class="form-yazi">Hesabın yok mu? <a href="Kayit.html" class="form-baglanti">Kayıt Ol</a></p>
        <p class="form-yazi"><a href="Eticaret.html" class="form-baglanti">← Ana Sayfaya Dön</a></p>
    </div>

</body>
</html>
